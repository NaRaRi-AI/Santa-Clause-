<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миссия: Спасти Рождество</title>
    <style>
        :root {
            --bg-night: #091224;
            --card-bg: rgba(14, 23, 44, 0.95);
            --accent-gold: #f3c653;
            --accent-silver: #d4e4f7;
            --accent-red: #c23b3b;
            --accent-green: #2d6a4f;
            --text-light: #f5f7fc;
            --border-frost: #b4d2e8;
        }

        body {
            background-color: var(--bg-night);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(45, 106, 79, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(194, 59, 59, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #15264a 0%, #091224 90%);
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 2px solid var(--border-frost);
            border-radius: 18px;
            box-shadow: 
                0 0 25px rgba(180, 210, 232, 0.25),
                0 0 50px rgba(243, 198, 83, 0.12),
                inset 0 0 15px rgba(180, 210, 232, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(7, 12, 24, 0.95);
            padding: 12px;
            border-bottom: 1px solid rgba(180, 210, 232, 0.3);
            font-size: 13px;
            color: var(--accent-gold);
            text-shadow: 0 0 8px rgba(243, 198, 83, 0.4);
        }

        .scene-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid var(--border-frost);
            background-color: #121d36;
            filter: brightness(0.95) contrast(1.05);
        }

        .content-area {
            padding: 22px;
            flex-grow: 1;
        }

        .speaker-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .speaker-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            object-fit: cover;
            background-color: #15264a;
            display: none;
        }

        h2 {
            margin: 0;
            color: var(--accent-gold);
            font-family: 'Times New Roman', serif;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(243, 198, 83, 0.3);
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 16px;
            color: #e2e8f5;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(to bottom, #1d3361, #0f1c38);
            color: var(--text-light);
            border: 1px solid var(--border-frost);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 14px;
            text-align: left;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(to bottom, #2b4987, #172a52);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(243, 198, 83, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .inventory-box {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed rgba(212, 228, 247, 0.25);
            font-size: 13px;
            color: var(--accent-silver);
        }

        #items-text {
            color: var(--accent-gold);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="status-bar">
        <span id="stat-time">🕒 Время: 12:00</span>
        <span id="stat-spirit">✨ Дух Рождества: 100%</span>
        <span id="stat-inventory">🎒 Предметы: нет</span>
    </div>

    <img id="scene-img" class="scene-image" src="scene_1.jpg" alt="Иллюстрация локации">

    <div class="content-area">
        <div class="speaker-box">
            <img id="speaker-avatar" class="speaker-avatar" src="" alt="Портрет">
            <h2 id="scene-title">Заголовок сцены</h2>
        </div>
        <p id="scene-text">Текст сцены загружается...</p>
        
        <div class="choices" id="choices-box"></div>

        <div class="inventory-box">
            Инвентарь: <span id="items-text">нет</span>
        </div>
    </div>
</div>

<script>
    let state = {
        time: 12,
        spirit: 100,
        inventory: [],
        currentScene: 'start'
    };

    const scenes = {
        // --- АКТ I ---
        start: {
            title: "Акт I. Полуденная побудка",
            text: "Тик-так... Маятниковые часы в кабинете показывают полдень. До начала новогоднего полета ровно 12 часов. За окном бушует метель, а в дверь кабинета раздается тревожный стук.",
            image: "scene_1.jpg",
            speaker: null,
            choices: [
                { text: "Выпить горячего какао и впустить эльфа", next: 'meet_elf', timeCost: 1, spiritChange: 5, addItem: 'Чашка какао' },
                { text: "Сразу открыть дверь и выслушать проблему", next: 'meet_elf', timeCost: 1, spiritChange: 0 },
                { text: "Заглянуть в волшебное зеркало погоды", next: 'magic_mirror', timeCost: 1, spiritChange: 0 }
            ]
        },
        meet_elf: {
            title: "Главный эльф-бригадир",
            text: "'Санта! Конвейер подарков заклинило шестеренками, а олени в загоне напуганы ледяными шипами!'",
            image: "scene_2.jpg",
            speaker: "elf_portrait.jpg",
            choices: [
                { text: "Бежать на фабрику чинить конвейер", next: 'factory_puzzle', timeCost: 2 },
                { text: "Отправиться в загон успокаивать оленей", next: 'reindeer_pen', timeCost: 2 }
            ]
        },
        magic_mirror: {
            title: "Волшебное зеркало",
            text: "Над миром клубится шторм, но дети ждут чуда. Время утекает сквозь пальцы.",
            image: "scene_4.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Впустить эльфа в кабинет", next: 'meet_elf', timeCost: 1 }
            ]
        },
        factory_puzzle: {
            title: "Фабрика подарков",
            text: "Механизмы гудят. Медведи и Щелкунчик застряли между шестеренок.",
            image: "scene_2.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Использовать магический посох", next: 'act_one_finish', timeCost: 2, spiritChange: 5 },
                { text: "Разобрать механизм вручную по чертежам", next: 'act_one_finish', timeCost: 3, spiritChange: 10, addItem: 'Чертеж шестеренок' }
            ]
        },
        reindeer_pen: {
            title: "Загон для оленей",
            text: "Олени бьют копытами перед замороженными фиолетовыми сорняками.",
            image: "scene_3.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Угостить оленей моховым печеньем", next: 'act_one_finish', timeCost: 2, spiritChange: 10, addItem: 'Моховое печенье' },
                { text: "Ласково поговорить с вожаком", next: 'act_one_finish', timeCost: 2, spiritChange: 5 }
            ]
        },
        act_one_finish: {
            title: "Конец Акта I",
            text: "Порядок наведен. Вечер на пороге (16:00), впереди алхимия саней!",
            image: "scene_1.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Перейти к Акту II", next: 'act2_start', timeCost: 0 }
            ]
        },

        // --- АКТ II ---
        act2_start: {
            title: "Акт II. Вечерний ангар",
            text: "Время 16:00. Сани на платформе, их нужно модернизировать перед ночным полетом.",
            image: "act2_sleigh.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Установить реактивный ускоритель", next: 'act2_route', timeCost: 1, spiritChange: -10, addItem: 'Реактивный двигатель' },
                { text: "Натереть полозья звездным воском и закрепить амулеты", next: 'act2_route', timeCost: 2, spiritChange: 15, addItem: 'Звездный воск' }
            ]
        },
        act2_route: {
            title: "Акт II. Планирование маршрута",
            text: "Голографическая карта сияет в темноте. Над полюсом бушует циклонический шторм.",
            image: "act2_map.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Пробиваться напрямую через Ледяной каньон", next: 'act2_takeoff', timeCost: 1 },
                { text: "Обойти шторм по Звездному коридору", next: 'act2_takeoff', timeCost: 2 }
            ]
        },
        act2_takeoff: {
            title: "Акт II. Взлет",
            text: "Все готово. Сани срываются с места и устремляются в вечернее небо под восторженные крики эльфов!",
            image: "act2_takeoff.jpg",
            speaker: "elf_portrait.jpg",
            choices: [
                { text: "Перейти к Акту III (Ночной полет)", next: 'act3_flight_scene', timeCost: 1 }
            ]
        },

        // --- АКТ III ---
        act3_flight_scene: {
            title: "Акт III. Ночной полет",
            text: "Часы бьют полночь. Сани мчатся над сверкающими мегаполисами под переливами северного сияния.",
            image: "act3_flight.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Сбросить подарки через дымоходы на крышах", next: 'act3_roof_scene', timeCost: 2, spiritChange: 5 }
            ]
        },
        act3_roof_scene: {
            title: "Акт III. Работа на крыше",
            text: "Санта грациозно опускается на заснеженную трубу и бережно опускает первый заветный подарок в дымоход.",
            image: "act3_roof.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Завершить развозку и взять курс на север", next: 'act3_return_scene', timeCost: 2, spiritChange: 10 }
            ]
        },
        act3_return_scene: {
            title: "Акт III. Возвращение домой",
            text: "Первые лучи солнца окрашивают заснеженные башни Лапландии. Сани триумфально приземляются в родной загон.",
            image: "act3_return.jpg",
            speaker: "elf_portrait.jpg",
            choices: [
                { text: "Праздновать победу Рождества!", next: 'ending_epic', timeCost: 0 }
            ]
        },

        // --- ФИНАЛ ---
        ending_epic: {
            title: "Триумфальный финал: Миссия выполнена!",
            text: "УРА! Рождество спасено! Все подарки доставлены, дух праздника на высоте, а Санта может отдохнуть у камина. Спасибо за игру!",
            image: "scene_1.jpg",
            speaker: "santa_portrait.jpg",
            choices: [
                { text: "Пройти игру заново", next: 'start', timeCost: 0, reset: true }
            ]
        }
    };

    function updateGame(sceneKey) {
        let scene = scenes[sceneKey];
        if (!scene) return;

        state.currentScene = sceneKey;

        document.getElementById('scene-title').innerText = scene.title;
        document.getElementById('scene-text').innerText = scene.text;
        document.getElementById('scene-img').src = scene.image;

        let avatar = document.getElementById('speaker-avatar');
        if (scene.speaker) {
            avatar.src = scene.speaker;
            avatar.style.display = 'block';
        } else {
            avatar.style.display = 'none';
        }

        document.getElementById('stat-time').innerText = `🕒 Время: ${state.time}:00`;
        document.getElementById('stat-spirit').innerText = `✨ Дух Рождества: ${state.spirit}%`;
        document.getElementById('items-text').innerText = state.inventory.length > 0 ? state.inventory.join(', ') : 'нет';

        let choicesBox = document.getElementById('choices-box');
        choicesBox.innerHTML = '';

        scene.choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => {
                if (choice.reset) {
                    state.time = 12;
                    state.spirit = 100;
                    state.inventory = [];
                    updateGame('start');
                    return;
                }

                state.time += choice.timeCost || 1;
                if (state.time > 24) state.time = 24;
                
                if (choice.spiritChange) {
                    state.spirit = Math.min(100, Math.max(0, state.spirit + choice.spiritChange));
                }
                if (choice.addItem && !state.inventory.includes(choice.addItem)) {
                    state.inventory.push(choice.addItem);
                }

                updateGame(choice.next);
            };
            choicesBox.appendChild(btn);
        });

        localStorage.setItem('santa_quest_final_state', JSON.stringify(state));
    }

    window.onload = function() {
        let saved = localStorage.getItem('santa_quest_final_state');
        if (saved) {
            try {
                let parsed = JSON.parse(saved);
                state = parsed;
                updateGame(state.currentScene);
                return;
            } catch(e) {}
        }
        updateGame('start');
    };
</script>

</body>
</html>
