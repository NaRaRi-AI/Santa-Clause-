<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миссия: Спасти Рождество</title>
    <style>
        :root {
            --bg-night: #091224;
            --card-bg: rgba(14, 23, 44, 0.95);
            --accent-gold: #f3c653;
            --accent-silver: #d4e4f7;
            --accent-red: #c23b3b;
            --accent-green: #2d6a4f;
            --text-light: #f5f7fc;
            --border-frost: #b4d2e8;
        }

        body {
            background-color: var(--bg-night);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(45, 106, 79, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(194, 59, 59, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #15264a 0%, #091224 90%);
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 2px solid var(--border-frost);
            border-radius: 18px;
            box-shadow: 
                0 0 25px rgba(180, 210, 232, 0.25),
                0 0 50px rgba(243, 198, 83, 0.12),
                inset 0 0 15px rgba(180, 210, 232, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(7, 12, 24, 0.95);
            padding: 12px;
            border-bottom: 1px solid rgba(180, 210, 232, 0.3);
            font-size: 13px;
            color: var(--accent-gold);
            text-shadow: 0 0 8px rgba(243, 198, 83, 0.4);
        }

        .scene-visual {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #121d36, #1f3560);
            border-bottom: 2px solid var(--border-frost);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .scene-icon {
            font-size: 55px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(243, 198, 83, 0.4));
        }

        .scene-subtitle {
            font-size: 14px;
            color: var(--accent-silver);
            font-style: italic;
        }

        .content-area {
            padding: 22px;
            flex-grow: 1;
        }

        .speaker-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .speaker-avatar {
            font-size: 28px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            background: #15264a;
            display: none;
            justify-content: center;
            align-items: center;
        }

        h2 {
            margin: 0;
            color: var(--accent-gold);
            font-family: 'Times New Roman', serif;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(243, 198, 83, 0.3);
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 16px;
            color: #e2e8f5;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(to bottom, #1d3361, #0f1c38);
            color: var(--text-light);
            border: 1px solid var(--border-frost);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 14px;
            text-align: left;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(to bottom, #2b4987, #172a52);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(243, 198, 83, 0.2);
        }

        .inventory-box {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed rgba(212, 228, 247, 0.25);
            font-size: 13px;
            color: var(--accent-silver);
        }

        #items-text {
            color: var(--accent-gold);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="status-bar">
        <span id="stat-time">🕒 Время: 12:00</span>
        <span id="stat-spirit">✨ Дух Рождества: 100%</span>
        <span id="stat-inventory">🎒 Предметы: нет</span>
    </div>

    <!-- Визуальный блок локации -->
    <div class="scene-visual">
        <div id="scene-icon" class="scene-icon">🏰</div>
        <div id="scene-subtitle" class="scene-subtitle">Резиденция Санты в Лапландии</div>
    </div>

    <div class="content-area">
        <div class="speaker-box">
            <div id="speaker-avatar" class="speaker-avatar">🎅</div>
            <h2 id="scene-title">Заголовок сцены</h2>
        </div>
        <p id="scene-text">Текст сцены загружается...</p>
        
        <div class="choices" id="choices-box"></div>

        <div class="inventory-box">
            Инвентарь: <span id="items-text">нет</span>
        </div>
    </div>
</div>

<script>
    let state = {
        time: 12,
        spirit: 100,
        inventory: [],
        currentScene: 'start'
    };

    const scenes = {
        start: {
            title: "Акт I. Полуденная побудка",
            text: "Тик-так... Тяжелые маятниковые часы в кабинете показывают ровно полдень. До начала новогоднего полета осталось ровно 12 часов. За окном бушует лапландская метель, а в дверь твоего кабинета доносится тревожный стук.",
            icon: "🪵",
            subtitle: "Кабинет Санты: камин, гирлянды и письма",
            speaker: null,
            choices: [
                { text: "Отпить горячего какао со специями и впустить эльфа", next: 'meet_elf', timeCost: 1, spiritChange: 5, addItem: 'Чашка какао' },
                { text: "Сразу распахнуть дверь и выслушать проблему", next: 'meet_elf', timeCost: 1, spiritChange: 0 },
                { text: "Посмотреть в волшебное зеркало погоды", next: 'magic_mirror', timeCost: 1, spiritChange: 0 }
            ]
        },
        meet_elf: {
            title: "Главный эльф-бригадир",
            text: "Эльф врывается внутрь, размахивая шапкой: 'Санта! Катастрофа! Магический конвейер подарков заклинило шестеренками, а олени отказываются выходить из загона — кто-то разбросал по снегу странные ледяные шипы!'",
            icon: "🧝",
            subtitle: "Эльфийская фабрика подарков",
            speaker: "🧝",
            choices: [
                { text: "Срочно бежать на фабрику разбираться с конвейером", next: 'factory_puzzle', timeCost: 2 },
                { text: "Сначала отправиться в загон к оленям и успокоить их", next: 'reindeer_pen', timeCost: 2 }
            ]
        },
        magic_mirror: {
            title: "Волшебное зеркало",
            text: "Ты заглядываешь в гладь зеркала. Над Европой и Америкой висят грозовые тучи, но дети ждут чуда. Время утекает сквозь пальцы!",
            icon: "🔮",
            subtitle: "Обсерватория погоды",
            speaker: "🎅",
            choices: [
                { text: "Отойти от зеркала и впустить эльфа в кабинет", next: 'meet_elf', timeCost: 1 }
            ]
        },
        factory_puzzle: {
            title: "Фабрика подарков",
            text: "Огромный механизм гудит и искрит. Механические плюшевые медведи и Щелкунчик застряли между шестеренок. Нужно быстро принять техническое решение!",
            icon: "⚙️",
            subtitle: "Цех сборки подарков",
            speaker: "🎅",
            choices: [
                { text: "Использовать магический посох, чтобы перезапустить шестеренки", next: 'act_one_finish', timeCost: 2, spiritChange: 5 },
                { text: "Разобрать механизм вручную по старинным чертежам", next: 'act_one_finish', timeCost: 3, spiritChange: 10, addItem: 'Чертеж шестеренок' }
            ]
        },
        reindeer_pen: {
            title: "Загон для оленей",
            text: "Гордые северные олени встревоженно бьют копытами. Вожак косит глазом на сугробы, где блещут замороженные фиолетовые сорняки.",
            icon: "🦌",
            subtitle: "Загон под северным сиянием",
            speaker: "🎅",
            choices: [
                { text: "Угостить оленей волшебным моховым печеньем", next: 'act_one_finish', timeCost: 2, spiritChange: 10, addItem: 'Моховое печенье' },
                { text: "Ласково поговорить с вожаком и расчистить снег", next: 'act_one_finish', timeCost: 2, spiritChange: 5 }
            ]
        },
        act_one_finish: {
            title: "Конец Акта I",
            text: "Конвейер и олени приведены в порядок. Но вечер уже на пороге (16:00), а впереди алхимия саней, подготовка упряжки и ночной полет!",
            icon: "✨",
            subtitle: "Переход к Акту II",
            speaker: "🎅",
            choices: [
                { text: "Перейти к Акту II (Вечерняя алхимия саней)", next: 'act2_start', timeCost: 0 }
            ]
        },
        
        // --- АКТ II ---
        act2_start: {
            title: "Акт II. Вечерний ангар и алхимия саней",
            text: "Стрелки часов перешагнули за 16:00. Ты спускаешься в секретный ангар. Волшебные сани ждут на платформе, но их нужно срочно модернизировать перед штормом.",
            icon: "🛷",
            subtitle: "Секретный гараж Санты",
            speaker: "🎅",
            choices: [
                { text: "Установить магический реактивный ускоритель (быстро, но рискованно)", next: 'act2_route', timeCost: 1, spiritChange: -5, addItem: 'Реактивный двигатель' },
                { text: "Натереть полозья звездным воском и закрепить амулеты", next: 'act2_route', timeCost: 2, spiritChange: 10, addItem: 'Звездный воск' }
            ]
        },
        act2_route: {
            title: "Акт II. Планирование маршрута",
            text: "Сани готовы. Перед тобой парит голографическая карта звездного неба. Над Северным полюсом бушует циклонический фронт. Как проложим первый отрезок пути?",
            icon: "🗺️",
            subtitle: "Обсерватория звездных маршрутов",
            speaker: "🎅",
            choices: [
                { text: "Пробиваться напрямую через Ледяной каньон (сэкономить время)", next: 'act2_takeoff_scene', timeCost: 1, spiritChange: -10 },
                { text: "Обойти шторм по высокому Звездному коридору (безопасно, но дольше)", next: 'act2_takeoff_scene', timeCost: 2, spiritChange: 5 }
            ]
        },
        act2_takeoff_scene: {
            title: "Акт II. Ночной взлет!",
            text: "Все приготовления завершены. Олени бьют копытами, упряжка сияет магией. Под восторженные крики эльфов сани взмывают в ночное небо навстречу северному сиянию!",
            icon: "🌠",
            subtitle: "Взлетная полоса Лапландии",
            speaker: "🧝",
            choices: [
                { text: "Завершить Акт II (Ночной полет продолжается...)", next: 'act2_finish', timeCost: 0 }
            ]
        },
        act2_finish: {
            title: "Продолжение следует...",
            text: "Ты блестяще справился с подготовкой и вывел сани на орбиту новогодней ночи! Спасибо за прохождение доступных актов квеста.",
            icon: "🎄",
            subtitle: "Финал текущей версии",
            speaker: "🎅",
            choices: [
                { text: "Пройти игру сначала", next: 'start', timeCost: 0, reset: true }
            ]
        }
    };

    function updateGame(sceneKey) {
        let scene = scenes[sceneKey];
        if (!scene) return;

        state.currentScene = sceneKey;

        document.getElementById('scene-title').innerText = scene.title;
        document.getElementById('scene-text').innerText = scene.text;
        document.getElementById('scene-icon').innerText = scene.icon;
        document.getElementById('scene-subtitle').innerText = scene.subtitle;

        let avatar = document.getElementById('speaker-avatar');
        if (scene.speaker) {
            avatar.innerText = scene.speaker;
            avatar.style.display = 'flex';
        } else {
            avatar.style.display = 'none';
        }

        document.getElementById('stat-time').innerText = `🕒 Время: ${state.time}:00`;
        document.getElementById('stat-spirit').innerText = `✨ Дух Рождества: ${state.spirit}%`;
        document.getElementById('items-text').innerText = state.inventory.length > 0 ? state.inventory.join(', ') : 'нет';

        let choicesBox = document.getElementById('choices-box');
        choicesBox.innerHTML = '';

        scene.choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => {
                if (choice.reset) {
                    state.time = 12;
                    state.spirit = 100;
                    state.inventory = [];
                    updateGame('start');
                    return;
                }

                state.time += choice.timeCost || 1;
                if (choice.spiritChange) {
                    state.spirit = Math.min(100, Math.max(0, state.spirit + choice.spiritChange));
                }
                if (choice.addItem && !state.inventory.includes(choice.addItem)) {
                    state.inventory.push(choice.addItem);
                }

                updateGame(choice.next);
            };
            choicesBox.appendChild(btn);
        });

        localStorage.setItem('santa_quest_icon_state', JSON.stringify(state));
    }

    window.onload = function() {
        let saved = localStorage.getItem('santa_quest_icon_state');
        if (saved) {
            try {
                let parsed = JSON.parse(saved);
                state = parsed;
                updateGame(state.currentScene);
                return;
            } catch(e) {}
        }
        updateGame('start');
    };
</script>

</body>
</html>
